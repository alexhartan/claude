name = "the-edge-worker"
main = "src/worker.js"
compatibility_date = "2026-01-01"
account_id = "63095e7d8d20aca0dc1cc137369aa058"

[vars]
# Production origin allowed to call the Worker (CORS).
ALLOWED_ORIGIN = "https://edge.galvanite.io"
FROM_EMAIL = "The Edge <edge@galvanite.io>"
# Base URL used to build the save-progress resume link.
APP_URL = "https://edge.galvanite.io"
# Where completed-lead notifications are sent.
NOTIFY_EMAIL = "alex@galvanite.io"

# KV namespace for saved sessions + completed leads.
[[kv_namespaces]]
binding = "SESSIONS"
id = "e46cd1dca61146a4baf32efc203c92b2"

# Secrets are set once on the deployed Worker and persist across deploys:
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put RESEND_API_KEY
# Optional — enable Google Sheet lead capture (see leads-sheet.gs for setup):
#   wrangler secret put LEADS_WEBHOOK_URL      # Apps Script /exec URL
#   wrangler secret put LEADS_WEBHOOK_SECRET   # shared secret matching the script
# recordLead() no-ops while LEADS_WEBHOOK_URL is unset, so this is safe to ship early.
# CI deploys (GitHub Actions) do NOT touch secrets.
# For local `wrangler dev`, put them in .dev.vars (gitignored) instead.
